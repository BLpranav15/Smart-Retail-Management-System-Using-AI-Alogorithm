{% extends "layout.html" %}

{% block title %}Sign Up - Grocery Recommendation{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Signup Card -->
            <div class="card shadow-lg">
                <div class="card-body">
                    <h2 class="text-center text-success">Create Your Account</h2>
                    <p class="text-center text-muted">Join us to get personalized grocery recommendations.</p>

                    <!-- Display Messages -->
                    {% if message %}
                        <div class="alert alert-{{ message_type }} text-center">{{ message }}</div>
                    {% endif %}

                    <!-- Signup Form -->
                    <form method="POST" action="{{ url_for('signup') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Sign Up</button>
                    </form>

                    <!-- Login Link -->
                    <p class="text-center mt-3">
                        Already have an account? <a href="{{ url_for('login') }}" class="text-primary">Log in here</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
